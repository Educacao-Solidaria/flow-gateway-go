name: load

# k6 contra o gateway sobre fakes (test/load): rodada curta no PR; a de 5.000 VUs é sob demanda.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      vus:
        description: usuários simultâneos (VUs do k6)
        default: "5000"
      ramp:
        description: subida até todos os VUs
        default: "1m"
      hold:
        description: tempo com todos os VUs
        default: "5m"

permissions:
  contents: read

concurrency:
  group: load-${{ github.ref }}
  cancel-in-progress: true

jobs:
  k6:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 340 || 15 }}
    env:
      K6_VERSION: v2.3.0
      K6_SHA256: 39c3117b6af817592dcd0ce4242105c0a7af10948c2a425306f0be8f7a8a8ab1
      VUS: ${{ inputs.vus || '5000' }}
      RAMP: ${{ inputs.ramp || '1m' }}
      HOLD: ${{ inputs.hold || '5m' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: instalar o k6
        run: |
          curl -fsSLo "$RUNNER_TEMP/k6.tgz" "https://github.com/grafana/k6/releases/download/$K6_VERSION/k6-$K6_VERSION-linux-amd64.tar.gz"
          echo "$K6_SHA256  $RUNNER_TEMP/k6.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/k6.tgz" -C "$RUNNER_TEMP" --strip-components=1
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: carga
        run: test/load/run.sh
