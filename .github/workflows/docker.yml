name: docker

# Imagem do gateway (Dockerfile na raiz): lint, build sem push e os testes de
# test/docker contra a imagem construída (< 20 MB, uid 65532, sem shell e o smoke: rotas
# de saúde, /metrics e SIGTERM no container). As regras do job image estão no
# TestDockerWorkflow.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash # com pipefail (sem `shell:`, o Actions roda `bash -e` sem ele)

jobs:
  hadolint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: docker run --rm -i hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d < Dockerfile

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GATEWAY_IMAGE: educacao-solidaria/flow-gateway:dev
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: build (sem push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          provenance: false
          tags: ${{ env.GATEWAY_IMAGE }}
          build-args: COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: testes da imagem
        env:
          GATEWAY_IMAGE_VERSION: flow-gateway dev (${{ github.sha }})
        # Sem GATEWAY_IMAGE os TestImage* pulam: o grep reprova o SKIP e o -run que não acha o smoke.
        run: |
          go test -count=1 -v -run '^TestImage' ./test/docker/ | tee "$RUNNER_TEMP/image.log"
          if grep -- '--- SKIP' "$RUNNER_TEMP/image.log"; then exit 1; fi
          grep -q '^--- PASS: TestImageSmoke ' "$RUNNER_TEMP/image.log"
