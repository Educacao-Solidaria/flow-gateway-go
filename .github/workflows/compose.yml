name: compose

# Ecossistema do deploy/compose (contratos da Fase 5, §1–§4): os 4 repositórios lado a lado
# (dos outros 3, a main), as imagens construídas pelo build: do próprio compose, sem push,
# `up --wait` (healthchecks de cache, rag, db e studio) e as sondas TestStack* de test/docker.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: compose-${{ github.ref }}
  cancel-in-progress: true

env:
  # Sem o artefato .dockerbuild no run e sem o evento do PR despejado no log do build.
  DOCKER_BUILD_RECORD_UPLOAD: false
  BUILDX_METADATA_PROVENANCE: disabled

jobs:
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: flow-gateway-go/deploy/compose
    steps:
      - uses: actions/checkout@v5
        with:
          path: flow-gateway-go
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: Educacao-Solidaria/semantic-cache-rs
          path: semantic-cache-rs
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: Educacao-Solidaria/brain-router-py
          path: brain-router-py
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: Educacao-Solidaria/agent-studio-ts
          path: agent-studio-ts
          persist-credentials: false
      - name: .env de mentira (o smoke não chama a OpenRouter)
        run: sed 's/=$/=valor-falso-do-ci/' .env.example > .env
      - name: contexto e tag de cada build, lidos do compose
        id: compose
        run: |
          echo "build=$(docker compose config --format json | jq -c '.services | map_values({context: .build.context, image})')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: build gateway
        uses: docker/build-push-action@v7
        with:
          context: ${{ fromJSON(steps.compose.outputs.build).gateway.context }}
          tags: ${{ fromJSON(steps.compose.outputs.build).gateway.image }}
          load: true
          provenance: false
          cache-from: type=gha,scope=compose-gateway
          cache-to: type=gha,mode=max,scope=compose-gateway
      - name: build cache
        uses: docker/build-push-action@v7
        with:
          context: ${{ fromJSON(steps.compose.outputs.build).cache.context }}
          tags: ${{ fromJSON(steps.compose.outputs.build).cache.image }}
          load: true
          provenance: false
          cache-from: type=gha,scope=compose-cache
          cache-to: type=gha,mode=max,scope=compose-cache
      - name: build rag
        uses: docker/build-push-action@v7
        with:
          context: ${{ fromJSON(steps.compose.outputs.build).rag.context }}
          tags: ${{ fromJSON(steps.compose.outputs.build).rag.image }}
          load: true
          provenance: false
          cache-from: type=gha,scope=compose-rag
          cache-to: type=gha,mode=max,scope=compose-rag
      - name: build studio
        uses: docker/build-push-action@v7
        with:
          context: ${{ fromJSON(steps.compose.outputs.build).studio.context }}
          tags: ${{ fromJSON(steps.compose.outputs.build).studio.image }}
          load: true
          provenance: false
          cache-from: type=gha,scope=compose-studio
          cache-to: type=gha,mode=max,scope=compose-studio
      - name: sobe o ecossistema
        run: docker compose up -d --no-build --wait --wait-timeout 180
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: flow-gateway-go/go.sum
      - name: sondas
        working-directory: flow-gateway-go
        env:
          COMPOSE_STACK: "1"
        run: go test -count=1 -v -run '^TestStack' ./test/docker/
      - name: estado e logs dos containers
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color
