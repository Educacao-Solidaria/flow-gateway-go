# Instalação: pip install pre-commit && pre-commit install --install-hooks -t pre-commit -t pre-push
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: gofmt -l -w
        language: system
        types: [go]
      - id: go-mod-tidy
        name: go mod tidy
        entry: go mod tidy -diff
        language: system
        pass_filenames: false
        files: (\.go|go\.mod|go\.sum)$
      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint run
        language: system
        pass_filenames: false
        types: [go]
      - id: go-test
        name: go test
        entry: go test -count=1 ./...
        language: system
        pass_filenames: false
        types: [go]
        stages: [pre-push]
