name: bench

# Benchmarks do PR contra a main no mesmo job (test/bench/run.sh): os dois lados
# rodam alternados na mesma máquina e o benchstat compara. Piora significativa de
# mais de 10% em sec/op, B/op ou allocs/op reprova; a label bench-ok aceita a
# piora justificada no PR (ponha a label e rode o job de novo).
on:
  pull_request:

permissions:
  contents: read
  pull-requests: read # a label é lida na hora: um re-run repete o evento antigo, sem ela

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2 # o merge commit do PR e os pais: HEAD^1 é a main
          persist-credentials: false # o código do PR roda nos benchmarks sem o token
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: instalar o benchstat
        run: go install golang.org/x/perf/cmd/benchstat@v0.0.0-20261009192801-be2c69fb417e
      - name: label bench-ok
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          labels=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/labels" --jq '.[].name')
          if grep -qx bench-ok <<<"$labels"; then echo ACCEPT=true >>"$GITHUB_ENV"; fi
      - name: benchmarks
        env:
          BASE: HEAD^1
        run: test/bench/run.sh
